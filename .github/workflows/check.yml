name: check
on: [push, pull_request]

# The jobs only read the repository
permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Install required libraries
        run: >
          sudo apt-get update && sudo apt-get install -y 
          python3 python3-pip python3-setuptools python3-wheel
          cmake make build-essential clang-tidy
          libpam0g-dev libinih-dev libevdev-dev libsystemd-dev
          python3-dev libopencv-dev libgtk-3-dev
          libdlib-dev libblas-dev liblapack-dev nlohmann-json3-dev
        
      - name: Install meson
        run: sudo python3 -m pip install meson==1.12.1 ninja==1.13.2

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: |
          meson setup build
          ninja -C build

      - name: Check source code
        run: |
          ninja clang-tidy -C build
