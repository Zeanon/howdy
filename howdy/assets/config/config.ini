# Howdy config file
# Press CTRL + X to save in the nano editor

[core]
# Print that face detection is being attempted
detection_notice = true

# Print that face detection has timed out
timeout_notice = true

# Do not print anything when a face verification succeeds
no_confirmation = false

# When a user without a known face model tries to use this script, don't
# show an error but fail silently
suppress_unknown = true

# Disable Howdy in remote sessions (SSH). They are recognized by the login session
# of logind, which the user can not change, and by the SSH variables of the environment
abort_if_ssh = true

# Disable Howdy if lid is closed
abort_if_lid_closed = true

# Disable howdy in the PAM
# The howdy command will still function
disabled = false

# Set a workaround to automatically dismiss the prompt if face or fingerprint
# auth succeed
#  off     user will have to press enter themselves
#  input   will send an enter keypress to stop the password prompt
#  native  will stop the prompt at PAM level (can lead to instability!)
# (service file arg: 'password:workaround=<value>')
workaround = off

# Show purely cosmetic information
# (service file arg: 'verbose')
verbose = true

# Show formatting blank lines
# (service file arg: 'blank-lines')
blank_lines = true

# Show no messages at all (usefull for login screens)
# (service file arg: 'quiet')
quiet = false

# A whitelist of users that can use howdy
# (service file arg: 'whitelist=<value>,<value2>')
#whitelist = ""

# A blacklist of users that can not use howdy
# (service file arg: 'blacklist=<value>,<value2>')
#blacklist = ""

# A safety timeout to ensure we can not deadlock
# You can use unit indicators for minutes, hours and days, default is seconds
#  m, min, mins, minute, minutes
#  h, hour, hours
#  d, day, days
# -1 represents no timeout
# (service file arg: 'global-timeout=<value>')
global_timeout = 30min


[face_authentication]
# Enable face authentication
# (service file arg: face-auth)
enable = true

# The number of seconds to search before timing out
# You can use unit indicators for minutes, hours and days, default is seconds
#  m, min, mins, minute, minutes
#  h, hour, hours
#  d, day, days
# -1 represents no timeout
# (service file arg: 'face-auth:timeout=<value>')
timeout = 4s

# How long a user without privileges (everybody except root and the user of the
# daemon) has to wait after an authentication before it can start the next one,
# so it can not keep the camera busy for everybody else. Same units as timeout,
# 0 turns it off.
start_cooldown = 2s

# Use CNN instead of HOG
# CNN model is much more accurate than the HOG based model, but takes much more
# power to run, and is meant to be executed on a GPU to attain reasonable speed.
use_cnn = false

# Use OpenVINO instead of CNN or HOG
# OpenVINO utilizes the iGPU on Intel CPUs (Iris Xe/UHD/Arc), thus increasing speed.
use_openvino = false

# How many retries howdy should be allowed to do
# (service file arg: 'face-auth:max-tries=<value>')
max_tries = 1

# The certainty of the detected face belonging to the user of the account
# On a scale of 0 to 100
certainty = 75

# Whether to use an anti-spoof model to enhance security
use_anti_spoof = true

# How certain the model has to be that the face is a real person (in percent)
anti_spoof_threshold = 95

# Use the damo-flir model for additional anti spoof protection
use_damo_flir = true

# How certain the model has to be that the face is a real person (in percent)
damo_flir_threshold = 95

# Whether micromotion detection should be used to harden the authentication
# against spoofing
micromotion_detection = true

# The size of the buffer used for micromotion detection
# A lower value mekes it react quicker but can ignore slow movements
micromotion_detection_buffer_size = 8

# The threshold of how much movement should be considered "alive"
# A lower value makes the liveness detection more strict but can increase
# false negatives
micromotion_threshold = 0.03

# Whether a texture detection should be used to harden against spoofing
texture_detection = true

# The size of the buffer used for texture detection
# A lower value mekes it react quicker but also makes it less stable
texture_detection_buffer_size = 5

# The threshold of how much "texture" should be considered "alive"
# A higher value makes the liveness detection more strict but can increase
# false negatives
texture_threshold = 22.5

# Whether a similarity detection should be used that discards frames that
# are either too similar to the last one (frozen video) or when the face changed
# too much (someone held up a foto) to harden the authentication against spoofing
similarity_detection = true

# The size of the buffer used for similarity detection
# A lower value mekes it react quicker but also makes it less secure
similarity_detection_buffer_size = 8

# The threshold of what should be considered "identical"
# If the similarity between the current and last frame is higher than this
# threshold, the frame is discarded
# A lower value makes the similarity detection more strict but also increases
# the chance of false negatives
identical_threshold = 99.75

# The threshold of what should be considered "too much change"
# If the similarity between the current and last frame falls below this threshold,
# the frame is discarded
# A higher value makes the similarity detection more strict but also increases
# the chance of false negatives
sudden_change_threshold = 90.0

# How many separate frames have to fall inside `certainty` before the face is
# accepted. A scan takes dozens of independent looks, so with 1 the deciding
# frame is the best of many tries and a lone outlier frame is enough to get in.
# Asking for several agreeing frames closes that gap without making the
# threshold itself harsher, so a legitimate user is not rejected in poor light --
# they simply wait a fraction of a second longer. 
# 1 restores the old single-frame behaviour.
confirmations = 5

# Whether to show the authentication popup at the top center
# (service file arg: 'face-auth:show-auth-popup')
show_auth_popup = false


[fingerprint]
# Spawn a second pam process that authenticates using fprintd to enable
# Face and fingerprint authentication simultaneously
# (service file arg: 'fingerprint')
enable = false

# Set the timeout for the fingerprint authentication
# You can use unit indicators for minutes, hours and days, default is seconds
#  m, min, mins, minute, minutes
#  h, hour, hours
#  d, day, days
# -1 represents no timeout
# (service file arg: 'fingerprint:timeout=<value>')
timeout = 30

# How many retries howdy should be allowed to do for the fingerprint authentication
# (service file arg: 'fingerprint:max-tries=<value>')
max_tries = 1


[password]
# Spawn a second pam process that authenticates using pam_unix to enable
# Face and password authentication simultaneously
# (service file arg: 'password')
enable = false

# Set the max tries to use to send the enter keypress for the input workaround
# (service file arg: 'password:max-enter-tries=<value>')
max_enter_tries = 5

# How many retries howdy should be allowed to do for the password
# (service file arg: 'password:max-tries=<value>')
max_tries = 1

# Whether there should be a 2 second delay after a failed password authentication
# (service file arg: 'password:nodelay')
nodelay = false

# The delay to wait after a failed password attempt
# At most a minute, for a negative value or one that is no number the default of 2 seconds is used
# You can use unit indicators for minutes, hours and days, default is seconds
#  m, min, mins, minute, minutes
#  h, hour, hours
#  d, day, days
# (service file arg: 'password:delay=<value>')'
delay = 2s


[video]
# The path of the device to capture frames from
# Video devices are usually found in /dev/v4l/by-path/
device_path = none

# Print a warning if the the video device is not found
warn_no_device = true

# Scale down the video feed to this maximum height
# Speeds up face recognition but can make it less precise
max_height = 320

# Set the camera input profile to this width and height
# The largest profile will be used if set to -1
# Automatically ignored if not a valid profile
frame_width = -1
frame_height = -1

# Reject a frame when the lowest 1/8 of the histogram (pixel brightness
# 0-31 out of 255) exceeds this percentage of total pixels.
# Higher values tolerate darker rooms; lower values reject more frames as dark.
# The default of 60 is calibrated for visible-light webcams. Pure-IR cameras
# in dim rooms commonly read 80-95% near-black pixels (face is lit by the
# IR emitter, background stays unlit) and need this raised to 80-95.
dark_threshold = 60

# The recorder to use. Can be either opencv (default), ffmpeg or pyv4l2.
# Switching from the default opencv to ffmpeg can help with grayscale issues.
recording_plugin = opencv

# Video format used by ffmpeg. Options include vfwcap or v4l2.
# FFMPEG only.
device_format = v4l2

# Force the use of Motion JPEG when decoding frames, fixes issues with YUYV
# raw frame decoding.
# OPENCV only.
force_mjpeg = false

# Which device OpenVINO should use to load the models
#  CPU
#  GPU
openvino_device = GPU

# Force the camera to use this V4L2 pixel format, given as its four letter code.
# Needed for IR sensors that only provide raw formats, e.g. Y10 for a 10-bit
# monochrome sensor. Leave empty to let OpenCV choose.
# OPENCV only.
pixel_format =

# Black level of raw frames (pixel_format Y10, Y12, Y16), subtracted before the
# frame is scaled down to 8 bits. Many OmniVision sensors use 64 in 10-bit mode.
# OPENCV only.
raw_black_level = 0

# Specify exposure value explicitly. This disables autoexposure.
# Use qv4l2 to determine an appropriate value.
# OPENCV only.
exposure = -1

# Specify the brightness value explicitly
# Comment out to not adjust it
#brightness = 

# Specify frame rate of the capture device.
# Some IR emitters will not function properly at the default framerate.
# Use qv4l2 to determine an appropriate value.
# OPENCV only.
device_fps = -1

# Rotate captured frames so faces are upright.
#  0  Check landscape orientation only
#  1  Check both landscape and portrait orientation
#  2  Check portrait orientations only
#  3  Rotate 90 degrees counter-clockwise
#  4  Rotate 90 degrees clockwise
# Modes 1 and 2 alternate the direction every frame, which lines up badly with
# IR emitters that light every second frame. Use 3 or 4 for such cameras.
# The add and test commands only apply the fixed modes 3 and 4.
rotate = 0


[snapshots]
# Capture snapshots of failed login attempts and save them to disk with metadata
# Snapshots are saved to /var/log/howdy/snapshots
save_failed = false

# Do the same as the option above but for successful attempts
save_successful = false

# Snapshots show faces, so they are not kept forever. Both limits apply to
# the whole snapshot directory and are checked after a snapshot was saved and
# when Howdy starts. Zero means no limit.
# Delete snapshots that are older than this
retention = 7d

# Keep at most this many snapshots, the oldest are deleted first
max_snapshots = 100


[rubberstamps]
# Enable specific extra checks after the user has been recognised
enabled = false

# What type of stamps to run and with what options. The type, timeout and
# failure mode are required. One line per stamp. Rule syntax:
#  stamptype  timeout  (failsafe | faildeadly)   [extra_argument=value]
stamp_rules =
	nod		5s		failsafe     min_distance=12


[debug]
# Show a short but detailed diagnostic report in console
# Enabling this can cause some UI apps to fail, only enable it to debug
end_report = false

# More verbose logging from the rubberstamps system
verbose_stamps = false

# Pass output of the GTK auth window to the terminal
gtk_stdout = false
